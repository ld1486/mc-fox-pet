<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>小狐狸</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div id="bubble" class="bubble"><span id="bubble-text"></span></div>
  <div id="hearts" class="hearts"></div>
  <div id="skins" class="skins"></div>
  <div id="sizer" class="sizer">
    <span class="sizer-name" data-i18n="size.label">大小</span>
    <input id="size-range" type="range" min="50" max="200" step="1" value="100" aria-label="size">
    <span id="size-value" class="sizer-value">100%</span>
  </div>
  <div id="viewer" class="sizer viewer">
    <span class="sizer-name" data-i18n="view.label">视角</span>
    <div class="viewer-rows">
      <label class="viewer-row">
        <span data-i18n="view.h">左右</span>
        <input id="yaw-range" type="range" min="-90" max="90" step="1" aria-label="yaw">
        <span class="sizer-value" id="yaw-value">0°</span>
      </label>
      <label class="viewer-row">
        <span data-i18n="view.v">上下</span>
        <input id="pitch-range" type="range" min="-12" max="55" step="1" aria-label="pitch">
        <span class="sizer-value" id="pitch-value">0°</span>
      </label>
    </div>
  </div>
  <div id="bar" class="bar">
    <button data-act="panel" data-i18n-title="nav.panelBtn" title="打开书桌">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7.5h7M8 11h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button data-act="skin" data-i18n-title="nav.skinBtn" title="换皮肤">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 15 9l6 .9-4.5 4.3 1.1 6.1L12 17.4 6.4 20.3l1.1-6.1L3 9.9 9 9l3-5.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <button data-act="size" data-i18n-title="nav.sizeBtn" title="调整大小">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 6.5v5M17 6.5v5M10 12.5v5M14 12.5v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".55"/></svg>
    </button>
    <button data-act="view" data-i18n-title="nav.viewBtn" title="调整视角">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 12c2-3.6 5-5.4 8.5-5.4S18.5 8.4 20.5 12c-2 3.6-5 5.4-8.5 5.4S5.5 15.6 3.5 12Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button data-act="sleep" data-i18n-title="nav.sleepBtn" title="睡觉 / 叫醒">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A7.5 7.5 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <button data-act="mute" data-i18n-title="nav.muteBtn" title="音效开关">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3l4-3v11l-4-3H4v-5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15.5 9.5a4 4 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script type="module" src="./pet.js"></script>
</body>
</html>
